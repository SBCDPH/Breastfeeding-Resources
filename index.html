<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Breastfeeding Rights & Pumping Resources</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 10px 20px;
      background-color: #FAF2E6;
      font-family: Source Sans Pro, sans-serif;
      color: #131940;
      display: flex;
      justify-content: center;
      font-size: 18px;
    }

    .page-wrapper {
      max-width: 1100px;
      width: 100%;
    }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 0;
      padding-bottom: 20px;
    }

    .resource-card {
      border: none;
      border-radius: 18px;
      padding: 36px;
      max-width: 350px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      color: #002D72;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .resource-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.15);
    }

    .resource-card h3 {
      margin: 0 0 14px 0;
      font-size: 24px;
      font-weight: 700;
    }

    .resource-card p {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
    }

    .bg-cdph { background-color: #F8B8B8; }
    .bg-dol { background-color: #FFDFA6; }
    .bg-nih { background-color: #C9E7E7; }
    .bg-wic-pumps { background-color: #B9D8A6; }
    .bg-wic-pdf { background-color: #D8C6F0; }
    .bg-myfamily { background-color: #FAD6B8; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: #ffffff;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      padding: 28px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      color: #002D72;
      position: relative;
      font-size: 18px;
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 26px;
    }

    .modal p {
      margin: 0 0 20px 0;
      font-size: 18px;
      line-height: 1.6;
    }

    .modal-close-x {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #666;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
    }

    .btn {
      border-radius: 999px;
      padding: 12px 26px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-secondary {
      background: #E6E6E6;
      color: #002D72;
    }

    .btn-primary {
      background: #002D72;
      color: #FFFFFF;
    }

    @media (max-width: 700px) {
      body { padding: 20px 10px; font-size: 17px; }
      .resource-card { font-size: 17px; padding: 30px; }
      .resource-card h3 { font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <div class="card-grid">

      <button class="resource-card bg-cdph"
        data-title="Lactation Accommodations"
        data-description="California Department of Public Health Guidance on workplace lactation accommodations and employer responsibilities."
        data-url="https://www.cdph.ca.gov/Programs/CFH/DMCAH/Breastfeeding/Pages/Lactation-Accommodation-Laws.aspx">
        <h3>Lactation Accommodations</h3>
        <p>California Department of Public Health guidance on workplace lactation accommodations.</p>
      </button>

      <button class="resource-card bg-dol"
        data-title="PUMP Act"
        data-description="Federal law details employee break time, privacy, and employer requirements under the PUMP Act."
        data-url="https://www.dol.gov/agencies/whd/fact-sheets/73-flsa-break-time-nursing-mothers">
        <h3>PUMP Act</h3>
        <p>Protections for pumping at work, including break time and privacy.</p>
      </button>

      <button class="resource-card bg-nih"
        data-title="Breastfeeding in Public"
        data-description="California Civil Code (CIV 43.3) protects the right to breastfeed in public and private settings."
        data-url="https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=43.3">
        <h3>Breastfeeding in Public</h3>
        <p>Learn about protections for breastfeeding in public and private settings.</p>
      </button>

      <button class="resource-card bg-wic-pdf"
        data-title="Returning to Work and Breastfeeding"
        data-description="CDC guidance to help parents continue breastfeeding after returning to work."
        data-url="https://www.cdc.gov/breastfeeding/features/returning-to-work-and-breastfeeding.html">
        <h3>Returning to Work & Breastfeeding</h3>
        <p>Practical CDC guidance for balancing work and breastfeeding.</p>
      </button>

      <button class="resource-card bg-wic-pumps"
        data-title="WIC – Breast Pump Program"
        data-description="Information on free and loaner breast pumps available through San Bernardino County WIC."
        data-url="https://wic.sbcounty.gov/breastfeeding/breastpumps/">
        <h3>WIC – Breast Pump Program</h3>
        <p>Learn about free and loaner pumps through SBC WIC.</p>
      </button>

      <button class="resource-card bg-myfamily"
        data-title="MyFamily WIC Breastfeeding Support"
        data-description="California WIC’s breastfeeding support and resources."
        data-url="https://myfamily.wic.ca.gov/NutritionHealth/BreastfeedingSupport">
        <h3>MyFamily WIC Support</h3>
        <p>Explore California WIC breastfeeding education and resources.</p>
      </button>

    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close-x" id="modal-close-x" aria-label="Close popup">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-description"></p>
      <div class="modal-buttons">
        <button class="btn btn-secondary" id="modal-cancel">Close</button>
        <button class="btn btn-primary" id="modal-open-link">Open Resource</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const cards = document.querySelectorAll('.resource-card');
      const backdrop = document.getElementById('modal-backdrop');
      const modalTitle = document.getElementById('modal-title');
      const modalDescription = document.getElementById('modal-description');
      const btnOpenLink = document.getElementById('modal-open-link');
      const btnCancel = document.getElementById('modal-cancel');
      const btnCloseX = document.getElementById('modal-close-x');

      let currentUrl = null;

      function openModal(title, description, url) {
        modalTitle.textContent = title;
        modalDescription.textContent = description;
        currentUrl = url && url.trim() !== "" ? url : null;
        btnOpenLink.style.display = currentUrl ? "inline-block" : "none";
        backdrop.classList.add('active');
      }

      function closeModal() {
        backdrop.classList.remove('active');
        currentUrl = null;
      }

      cards.forEach(card => {
        card.addEventListener('click', () => {
          openModal(
            card.getAttribute('data-title'),
            card.getAttribute('data-description'),
            card.getAttribute('data-url')
          );
        });
      });

      btnCancel.addEventListener('click', closeModal);
      btnCloseX.addEventListener('click', closeModal);
      btnOpenLink.addEventListener('click', () => currentUrl && window.open(currentUrl, '_blank'));
      backdrop.addEventListener('click', e => e.target === backdrop && closeModal());
      document.addEventListener('keydown', e => e.key === 'Escape' && closeModal());
    })();
  </script>

</body>
</html>
